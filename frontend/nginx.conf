server {
  listen 80;
  root /usr/share/nginx/html;

  # Photo uploads go up to 5 MB; nginx's default limit is only 1 MB
  client_max_body_size 6m;

  # Docker's internal DNS. Looking "backend" up per request (instead of at startup)
  # means nginx still starts when the backend container isn't running yet.
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:5000;

  # API calls and photos -> backend container (headers tell it who the real visitor is)
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /uploads/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  # Vite puts a hash in these file names, so they can be cached for a year
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Never cache index.html, so a new deploy shows up right away
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # /browse, /login, /items/5 ... are React Router pages, not files: send index.html
  location / {
    try_files $uri /index.html;
  }
}
